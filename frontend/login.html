<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Password Manager - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007BFF", // Overriding with user-requested accent blue
                        "background-light": "#121212", // User requested dark theme only
                        "background-dark": "#121212",
                        "surface-dark": "#1E1E1E",
                        "text-primary-dark": "#E0E0E0",
                        "text-secondary-dark": "#A0A0A0",
                        "border-dark": "#333333",
                        "error": "#D32F2F",
                        "success": "#388E3C"
                    },
                    fontFamily: {
                        "display": ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-dark text-text-primary-dark">
<div class="relative flex h-screen w-full flex-col items-center overflow-x-hidden pt-5 sm:pt-10">
<!-- Header -->
<header class="flex w-full max-w-lg items-center justify-center gap-4 px-4 pb-10 sm:justify-start">
<div class="text-primary text-xl">
<span class="material-symbols-outlined !text-3xl">lock</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-white">Password Manager</h1>
</header>
<!-- Main Content Card -->
<main class="w-full max-w-lg rounded-xl bg-surface-dark p-6 sm:p-10">
<div class="flex flex-col gap-8">
<!-- Page Heading -->
<div class="flex flex-col gap-2">
<h2 class="text-4xl font-black leading-tight tracking-tighter text-white">Access Your Vault</h2>
<p class="text-text-secondary-dark">Enter your credentials to continue.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6">
<!-- Email Field -->
<label class="flex flex-col gap-2">
<p class="text-base font-medium leading-normal text-text-primary-dark">Correo electrónico</p>
<input class="form-input h-14 w-full flex-1 resize-none overflow-hidden rounded-lg border border-border-dark bg-background-dark p-4 text-base font-normal leading-normal text-white placeholder:text-text-secondary-dark focus:border-primary focus:outline-0 focus:ring-1 focus:ring-primary" placeholder="tu@email.com" type="email" value=""/>
</label>
<!-- Password Field -->
<label class="flex flex-col gap-2">
<p class="text-base font-medium leading-normal text-text-primary-dark">Contraseña</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input h-14 w-full flex-1 resize-none overflow-hidden rounded-l-lg border border-r-0 border-border-dark bg-background-dark p-4 pr-2 text-base font-normal leading-normal text-white placeholder:text-text-secondary-dark focus:z-10 focus:border-primary focus:outline-0 focus:ring-1 focus:ring-primary" placeholder="Introduce tu contraseña" type="password" value=""/>
<button aria-label="Toggle password visibility" class="flex items-center justify-center rounded-r-lg border border-l-0 border-border-dark bg-background-dark px-4 text-text-secondary-dark hover:text-text-primary-dark" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
<!-- Status Message Area (Initially Empty) -->
<div class="h-6 text-sm">
<!-- Example Error Message -->
<!-- <p class="text-error">Invalid credentials. Please try again.</p> -->
<!-- Example Success Message -->
<!-- <p class="text-success">Registration successful! Please log in.</p> -->
</div>
<!-- Button Group -->
<div class="flex flex-col items-stretch gap-4">
<button class="flex h-12 min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary px-5 text-base font-bold leading-normal tracking-wide text-white transition-opacity hover:opacity-90" type="submit">
<span class="truncate">Iniciar sesión</span>
</button>
<button class="flex h-12 min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg border border-border-dark bg-transparent px-5 text-base font-bold leading-normal tracking-wide text-text-secondary-dark transition-colors hover:bg-white/5 hover:text-white" type="button">
<span class="truncate">Registrar</span>
</button>
</div>
</form>
</div>
</main>
</div>
</body></html>
