<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Password Manager Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#7dd4fc",
              "background-light": "#f5f7f8",
              "background-dark": "#0f1d23",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center py-10 px-4 sm:px-6 lg:px-8">
<div class="layout-content-container flex flex-col w-full max-w-2xl flex-1">
<div class="bg-white/5 dark:bg-[#1A1A1A] p-6 sm:p-8 rounded-xl border border-white/10 dark:border-[#2C2C2E] shadow-2xl shadow-black/20">
<div class="flex flex-col items-stretch justify-start gap-8">
<div class="flex flex-col gap-2">
<h1 class="text-2xl font-bold leading-tight tracking-tight text-white dark:text-[#F2F2F7]">Contraseña Maestra y Secreto de Dispositivo</h1>
<p class="text-base font-normal leading-normal text-gray-400 dark:text-[#8A8A8E]">
                                    Use el secreto de su dispositivo para iniciar sesión en otros dispositivos sin tener que compartir su contraseña maestra.
                                </p>
</div>
<div class="flex flex-col gap-6">
<label class="flex flex-col w-full">
<p class="text-sm font-medium leading-normal pb-2 text-white dark:text-[#F2F2F7]">Contraseña Maestra</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white dark:text-[#F2F2F7] focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-700 dark:border-[#3a4c55] bg-gray-800 dark:bg-[#2C2C2E] focus:border-primary h-12 placeholder:text-gray-500 dark:placeholder:text-[#8A8A8E] p-3 rounded-r-none border-r-0 text-base font-normal leading-normal" placeholder="Ingrese su contraseña maestra" type="password" value=""/>
<div class="text-gray-400 dark:text-[#8A8A8E] flex border border-gray-700 dark:border-[#3a4c55] bg-gray-800 dark:bg-[#2C2C2E] items-center justify-center pr-3 rounded-r-lg border-l-0">
<span class="material-symbols-outlined cursor-pointer" style="font-size: 20px;">visibility_off</span>
</div>
</div>
</label>
<div class="flex flex-col sm:flex-row flex-1 gap-3 flex-wrap justify-start">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-gray-700 dark:bg-[#2C2C2E] text-white dark:text-[#F2F2F7] text-sm font-medium leading-normal tracking-wide hover:bg-gray-600 dark:hover:bg-white/20 transition-colors">
<span class="truncate">Crear Secreto</span>
</button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-gray-700 dark:bg-[#2C2C2E] text-white dark:text-[#F2F2F7] text-sm font-medium leading-normal tracking-wide hover:bg-gray-600 dark:hover:bg-white/20 transition-colors">
<span class="truncate">Exportar</span>
</button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-gray-700 dark:bg-[#2C2C2E] text-white dark:text-[#F2F2F7] text-sm font-medium leading-normal tracking-wide hover:bg-gray-600 dark:hover:bg-white/20 transition-colors">
<span class="truncate">Importar</span>
</button>
</div>
</div>
<hr class="border-t border-white/10 dark:border-[#2C2C2E]"/>
<div class="flex flex-col sm:flex-row items-center gap-4 justify-between">
<div class="flex items-center gap-3">
<div class="shrink-0">
<div class="flex size-7 items-center justify-center"><div class="size-2.5 rounded-full bg-[#34C759]"></div></div>
</div>
<p class="text-sm font-medium leading-normal text-white dark:text-[#F2F2F7] flex-1 truncate">K_mix listo</p>
</div>
<button class="flex w-full sm:w-auto min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#FF3B30]/80 text-white text-sm font-medium leading-normal tracking-wide hover:bg-[#FF3B30] transition-colors">
<span class="truncate">Cerrar Sesión</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
